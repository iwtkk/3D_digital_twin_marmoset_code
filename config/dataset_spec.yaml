version: 1

# Path definitions (central place for hard-coded paths)
# The following are symlinks at the repository root (already in .gitignore)
# Created all at once by setup_data_links.sh
paths:
  vid: "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data/video_data"
  results_2d: "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data/2D_temporal_keypoint_data"
  results: "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data"
  logs: "{PROJECT_ROOT}/logs"        # log output directory

dataset:
  name: marmo3dpose
  description: >
    Links per-session videos (stored at 25fps) and processed outputs (24fps-based)
    by session ID, for discovery, validation, loading, visualization and concatenation.

  # Roots (via the symlinks in the paths section)
  roots:
    video_roots:
      - "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data/video_data"
    results_root: "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data"

  # Single source of truth for camid (8 cameras)
  cameras:
    source: "{PROJECT_ROOT}/config/marmo*/config.yaml"
    field: "camera_id"
    expected_count: 8
    # Fill in the actual values once decided (fix 0-7 / 1-8 / 8-digit etc.)
    allowed_ids:
      - "23506226"
      - "23511607"
      - "23506214"
      - "23506236"
      - "23511614"
      - "23506237"
      - "23511613"
      - "23506239"
    ordering: "config"  # the order in config.yaml is authoritative

  ids:
    # Define the session ID independently of the camera (removes ambiguity)
    # Enumerate prefixes explicitly (do not mix dailylife and cj)
    session_prefixes:
      - "dailylife_cj"
      - "cj"

    # Session ID (without cam)
    session_id_regex: "^(?P<prefix>dailylife_cj|cj)(?P<animal>\\d+)_(?P<date>\\d{8})_(?P<time>\\d{6})$"

    # Video folder ID (session_id + .camid)
    video_folder_id_template: "{session_id}.{camid}"
    video_folder_id_regex: "^(?P<session_id>(dailylife_cj|cj)\\d+_\\d{8}_\\d{6})\\.(?P<camid>.+)$"

    # Processed folder ID (session_id)
    results_folder_id_template: "{session_id}"

  layout:
    # Video chunk spec
    video_chunks:
      filename_template: "{chunk_index:06d}.mp4"
      chunk_frames_nominal: 10000
      last_chunk_may_be_short: true

    # Video metadata (for imgstore lookup)
    metadata:
      filename: "metadata.yaml"
      # Fix the location in the spec (so the Session class need not guess)
      path_template: "{video_root}/{video_folder_id}/metadata.yaml"

    # npz (only existence is required)
    npz:
      # Require the number of npz files to match the number of mp4 files
      must_match_video_chunk_count: true
      # If the location is unknown, fix it to e.g. the same directory (change as needed)
      path_template: "{video_root}/{video_folder_id}/{chunk_index:06d}.npz"

  discovery:
    # Specify the * in vid* / 3d* as allowed candidates with priority
    video_root_priority:
      - "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/marmoset_keypoint_data/video_data"

    results_subdirs:
      - 3D_temporal_keypoint_data

    # Behavior when multiple are found (defined by the spec)
    on_multiple_matches:
      policy: "priority_first"   # priority_first / latest_mtime / error / collect_all
      latest_key: "mtime"

  artifacts:
    # 3D (required)
    kp3d:
      required: true
      path_templates:
        - "{results_root}/{results_subdir}/{results_folder_id}/kp3d_fxdJointLen.pickle"
        - "{results_root}/{results_subdir}/{results_folder_id}/kp3d.pickle"
        - "{results_root}/{results_subdir}/{results_folder_id}/kp3d*.pickle"
      selection:
        # Define "either is fine" in the spec: priority order
        prefer_contains:
          - "fxdJointLen"
        fallback: "first_match"  # first_match / latest_mtime / error

    # 2D (optional: used if present)
    kp2d:
      required: false
      any_of:
        - "{results_root}/{results_subdir}/{results_folder_id}/kp2d_f.pickle"
        - "{results_root}/{results_subdir}/{results_folder_id}/kp2d.pickle"
        - "{results_root}/{results_subdir}/{results_folder_id}/kp2d*.json"
        - "{results_root}/{results_subdir}/{results_folder_id}/kp2d*.pickle"

    # Additional outputs (optional)
    alldata_json:
      required: false
      path_template: "{results_root}/{results_subdir}/{results_folder_id}/{camid}/alldata.json"

  integrity:
    # Skip checks (as a checklist)
    skip_policy:
      if_any_fail: "skip_session"   # skip_session / raise / mark_invalid_only
      record_log: true

    required_video:
      must_have_all_cameras: true
      must_have_metadata: true
      must_have_mp4_at_least_one_chunk: true
      must_have_npz_count_match_mp4: true

    sync_check:
      # Require that the offset is not 5000 frames or more
      enabled: true
      max_frame_diff: 5000
      basis: "total_frames_per_cam"  # total_frames_per_cam / duration / timestamps
      on_violation: "skip_session"

    required_results:
      must_have_kp3d_at_least_one: true

  timebase:
    # Mapping between 25fps-stored videos and 24fps-based processed results
    video_fps_stored: 25.0
    processing_fps: 24.0

    # Start time is based on the start frame, which can be read from imgstore
    alignment:
      truth_source: "imgstore_metadata"  # imgstore_metadata / explicit_timestamp / manual_offset
      start_frame_key: "imgstore_start_frame"  # which key in metadata.yaml is authoritative (fill in once decided)

    mapping:
      # Fix the t24 -> t25 mapping in the spec (including rounding rule)
      formula: "t25 = round(t24 * video_fps_stored / processing_fps)"
      rounding: "nearest"   # nearest / floor / ceil
      clamp:
        min_frame: 0
        max_frame: "video_total_frames_minus_1"

  logging:
    # Skip log (makes downstream steps easier)
    format: "jsonl"
    path: "{PROJECT_ROOT}/logs/skip_log.jsonl"
    fields:
      - timestamp
      - session_id
      - camid_missing
      - missing_files
      - failed_checks
      - exception
      - traceback

  partitioning:
    # split by yyyymmdd
    by_date:
      enabled: true
      key: "date"   # extracted from session_id
      range_inclusive: ["00000000", "99999999"]  # fill in if needed

    # Diseased/healthy split (specified by date)
    health_status:
      enabled: true
      source: "{PROJECT_ROOT}/config/health_status.yaml"
      schema:
        # Example:
        # cj001:
        #   diseased_from: "20250101"
        #   diseased_to:   "20250331"
        #   notes: "..."
        animal_key: "animal"
        date_key: "date"

  aggregation:
    # Concatenate 3D pose estimation results per individual
    enabled: true
    group_by: ["animal"]
    index_columns: ["animal", "session_id", "frame"]
    include_camid: false  # false if 3D is per session, true to keep per cam
    output:
      # parquet recommended if large (pickle also allowed)
      format: "parquet"   # parquet / hdf5 / pickle
      path_template: "{PROJECT_ROOT}/outputs/aggregate/{animal}/kp3d_aggregate.{ext}"
      compression: "zstd"   # for parquet
