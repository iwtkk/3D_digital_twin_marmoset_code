version: 1

render:
  description: >
    Specifies whether to apply kp3d (temp3d) taken from Dataset/Session to the Blender armature.
    Renders from 1-8 specified directions and saves the result.
         The output format can be video or images.
    

  inputs:
    base_blend:
      # Formalizes the md note "it would be good to include base blender info"
      path: "{PROJECT_ROOT}/3D_digital_twin_marmoset_data/3D_digital_twin_data/3D_digitaltwin_marmoset_blender.blend"
      require_blender_version: false
      blender_version: ""  # e.g. "4.1.0" (fill in to pin)

    temp3d: # kp3d.pickle path removed since it can be passed from the dataset
      # Specify save-then-temp3d
      format: "npz"  # npz / json / pickle
      path_template: "{PROJECT_ROOT}/tmp/temp3d/{session_id}/{frame:08d}.npz"
      schema_ref: "kp3d_schema_v1"

  csv:
    init:
      neck_tail: [1.50-0.340, 0.995-0.03, 0.780]
      # rotate: [0, 0, 0]
      # rotate_center_coords: [0, 0, 0]
      # translate: [] # decide based on shoulder size
    path_template: "{PROJECT_ROOT}/outputs/csv/{session_id}/{frame:08d}.csv"

  armature:
    object_name: "NF_Armature"
    bone_mapping:
      # kp3d joint name -> Blender bone name (direction unified, since comments and data were reversed)
      "pts_base_": "Base"
      "pts_r_wrist_": "Forearm_IK.R"
      "pts_l_wrist_": "Forearm_IK.L"
      "pts_r_ankle_": "Foot_IK.R"
      "pts_l_ankle_": "Foot_IK.L"
      "pts_nose_": "Head_IK"
      "pts_shoulder_mid_": "Chest_IK"
      "pts_l_elbow_": "Elbow_IK_L"
      "pts_r_elbow_": "Elbow_IK_R"
      "pts_l_knee_": "Knee_IK.L"
      "pts_r_knee_": "Knee_IK.R"
      "pts_backbone_peak_": "Chest_Control_IK"
      "pts_tail_1_": "Tail0_IK"
      "pts_tail_2_": "Tail_IK"
    units:
      # Finally fix here whether 3D is in mm or m, etc.
      length_unit: "meters"  # csv is already saved in meters
      blender_unit: "meters" # Blender scene unit (usually meters)
      scale_factor: 1/1000    # kp3d(mm) -> Blender(m)

  rendering:
    # Which rendering configuration to use (exactly one)
    profile: "env_camera"  # env_camera / marmo_eyes / marmo_an_eye
    profiles:
      env_camera:
        engine: "CYCLES"
        resolution:
         source: "{PROJECT_ROOT}/config/marmo*/config.yaml"
         field: "img_size"          # [W, H]
        samples: 500
        transparent_background: false
        views:
         count: 8                   # fine to keep fixed (also usable for validation)
         camera_pattern: "Camera.{camera_id}"
         view_index:
           source: "{PROJECT_ROOT}/config/marmo*/config.yaml"
           field: "camera_id"       # array of IDs for 8 cameras
           ordering: "config"       # use the order in config
      marmo_eyes:
        engine: "CYCLES"   # CYCLES / EEVEE
        resolution: [1080, 1080]
        samples: 500
        transparent_background: false
        views:
          # camera_l, camera_r (fixed)
          cameras: ["camera_l", "camera_r"]
      marmo_an_eye:
        engine: "CYCLES"   # CYCLES / EEVEE
        resolution: [1920, 1080] # wide aspect, assuming binocular view
        samples: 500
        transparent_background: false
        views:
          # either camera_l or camera_r (fixed)
          camera: "camera_l"

    output:
      video:
        video_format: "mp4"
        # A video is normally one file per (frame range x view) (per-frame was unnatural, so fixed)
        path_template: "{PROJECT_ROOT}/outputs/render/video/{animal}/{session_id}/{start_frame:08d}_{end_frame:08d}/view_{view_id}.mp4"
        overwrite: true
        #Start/end frames are specified each time
      image:
        image_format: "png"
        path_template: "{PROJECT_ROOT}/outputs/render/image/{animal}/{session_id}/{frame:08d}/view_{view_index:02d}.png"
        overwrite: true
        # Frames are specified at runtime (multiple allowed)
  pipeline:
    # Fix the execution steps in the spec (separation of responsibilities)
    steps:
      - "select_frames_or_range"  # Dataset side decides target frame(s) or range
      - "export_temp3d"           # Save kp3d in temp3d format (per frame)
      - "blender_apply_pose"      # Apply to armature (can be turned OFF via runtime flag)
      - "render_views"            # Render according to profile (8 directions/binocular/monocular)
      - "write_manifest"          # Record what was output (reproducibility)
      
  manifests:
    enabled: true
    format: "json"
    path_template: "{PROJECT_ROOT}/outputs/render/{animal}/{session_id}/manifest.json"
    fields:
      - animal
      - session_id
      - frames            # image: frame array / video: start/end
      - render_profile    # env_camera / marmo_eyes / marmo_an_eye
      - view_ids          # e.g. ["Camera.0".."Camera.7"] or ["camera_l","camera_r"]
      - kp3d_source_path
      - status            # success / skipped / failed
      - skip_reason       # optional
